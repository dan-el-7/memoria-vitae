# VMA configuration example — copy to desktop/config.toml and edit.
# The desktop auto-saves runtime changes to config.toml (model picks from the UI).

ollama_url = "http://localhost:11434"

[vision]
kind = "ollama"                    # ollama | openai_compat (cloud; flips the egress indicator)
model = "qwen3-vl:2b"
repeat_penalty = 1.3               # tames the 2B model's loop mode on screen-dense frames
num_ctx = 8192                     # headroom for bounded grammar output + visual tokens
keep_alive = -1                    # numeric: pin the VLM (string "-1" is rejected)
# repeat_penalty = 1.2             # prevents thinking/repetition loops on reasoningenable_thinking = false            # with thinking on, `format` is NOT applied (see AGENTS.md)
temperature = 0.2

[reasoning]
kind = "ollama"
model = "huihui_ai/qwen3-abliterated:8b"
num_ctx = 12800
keep_alive = "10m"
# num_gpu = 20                     # Ollama GPU layers; on 8 GB cards use hybrid placement
#                                  # (≈20) so the pinned VLM + reasoning LLM coexist.
#                                  # Full-GPU placement EVICTS the VLM (verified).
# repeat_penalty = 1.2             # prevents thinking/repetition loops on reasoningenable_thinking = false
temperature = 0.2

[pipeline]
change_mad_threshold = 6.0         # 64x48 mean-absolute-difference gate
change_hash_threshold = 12         # dHash hamming gate
intake_queue_capacity = 3          # bounded, latest-frame-wins
min_interval_ms = 250
max_interval_ms = 10000
save_frames = "important"          # none | important (>=2) | all
media_max_side = 1024              # downscale before VLM + storage (854=480p, 1280=720p, 1920=1080p)
media_jpeg_quality = 70
media_retention_minutes = 0        # 0 = keep forever
media_budget_bytes = 0             # 0 = unlimited; eviction protects importance >= 2
voice_note_context_minutes = 2     # temporal link window for voice notes

[embeddings]
enabled = true
kind = "ollama"
model = "nomic-embed-text"         # ollama pull nomic-embed-text
keep_alive = "10m"

[stt]
enabled = false                    # opt-in; also needs: pip install faster-whisper
model = "small"
compute_type = "int8"
device = "cpu"
language = ""                      # empty = auto-detect

[server]
host = "127.0.0.1"                 # use 0.0.0.0 for trusted-LAN phone pairing
port = 8619
relay_url = ""                     # tcp://host:8765 for Internet pairing via relay/
relay_reg_token = ""
