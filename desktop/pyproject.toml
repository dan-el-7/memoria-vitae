[project]
name = "vma"
version = "0.1.0"
description = "Visual Memory & Analysis Agent - desktop inference server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pillow>=11.0",
    "websockets>=13.0",
    "cryptography>=43.0",
    "zeroconf>=0.140",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vma*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
